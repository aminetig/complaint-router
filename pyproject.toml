[project]
name = "complaint-router"
version = "1.0.0"
description = "Routage automatique des réclamations clients bancaires par NLP : PyTorch, ONNX, FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Amine Tighiouart" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["complaint_router", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
